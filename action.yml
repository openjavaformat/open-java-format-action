name: 'Open Java Format Check'
description: 'Checks Java code formatting with the open-java-format native binary'
author: 'abashev'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  mode:
    description: 'Which files to check: "changed" for files from PR/push, "all" for every .java file'
    required: false
    default: 'changed'
  code-scanning:
    description: 'Also report the version check to code scanning: "true" raises an alert under Security → Code scanning while a newer open-java-format is out. Off by default, because the upload needs the security-events: write permission; without it the upload is skipped.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Read the open-java-format version
      id: version
      shell: bash
      run: |
        # The version to check with comes from .open-java-format-version in the repository root,
        # the file the pre-commit hook reads too, so that the two cannot drift apart.
        FILE=".open-java-format-version"
        if [ ! -f "$FILE" ]; then
          echo "::error::No $FILE in the repository root. Put the open-java-format version to check with in it, one of the releases at https://github.com/openjavaformat/open-java-format/releases, for example: echo 21.0.1 > $FILE"
          exit 1
        fi
        VERSION=$(head -n1 "$FILE" | tr -d '[:space:]')
        if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
          echo "::error file=$FILE,line=1::$FILE holds '$VERSION', not an open-java-format version such as 21.0.1."
          exit 1
        fi
        echo "Checking with open-java-format $VERSION, from $FILE."
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Detect platform
      id: platform
      shell: bash
      run: |
        OS=$(uname -s)
        ARCH=$(uname -m)

        case "${OS}-${ARCH}" in
          Linux-x86_64)  SUFFIX="linux-glibc_x86-64" ;;
          Linux-aarch64) SUFFIX="linux-glibc_aarch64" ;;
          Darwin-arm64)  SUFFIX="macos_aarch64" ;;
          Darwin-x86_64) SUFFIX="macos_x86-64" ;;
          MINGW*-x86_64 | MSYS*-x86_64) SUFFIX="windows_x86-64" ;;
          *)
            echo "::error::No open-java-format native binary for ${OS}-${ARCH}. Supported: Linux x86_64, Linux aarch64, macOS aarch64, macOS x86_64, Windows x86_64."
            exit 1
            ;;
        esac

        # The Windows binary is an .exe, on Maven Central and on disk. It exists from 2.98.0.2 on.
        if [ "$SUFFIX" = "windows_x86-64" ]; then
          EXTENSION="exe"
          BINARY="open-java-format.exe"
        else
          EXTENSION="bin"
          BINARY="open-java-format"
        fi

        echo "suffix=$SUFFIX" >> "$GITHUB_OUTPUT"
        echo "extension=$EXTENSION" >> "$GITHUB_OUTPUT"
        echo "binary=$BINARY" >> "$GITHUB_OUTPUT"

    - name: Check for newer open-java-format version
      id: latest
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"

        # Best-effort version check — must never fail the build. The GitHub API
        # returns 403 for unauthenticated CI requests (rate limit), so authenticate
        # with the job token when available and tolerate any failure.
        AUTH=()
        if [ -n "${GH_TOKEN:-}" ]; then
          AUTH=(-H "Authorization: Bearer $GH_TOKEN")
        fi

        LATEST=$(curl -sSL "${AUTH[@]}" -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/openjavaformat/open-java-format/releases/latest 2>/dev/null \
          | jq -r '.tag_name // empty' 2>/dev/null || true)

        echo "version=$LATEST" >> "$GITHUB_OUTPUT"
        if [ -z "$LATEST" ]; then
          echo "Could not check the latest open-java-format version — skipping this check."
        elif [ "$LATEST" != "$VERSION" ]; then
          echo "::warning file=.open-java-format-version,line=1::A newer open-java-format version is available: $LATEST (.open-java-format-version has $VERSION)"
        fi

    - name: Report the version check to code scanning
      if: inputs.code-scanning == 'true' && steps.latest.outputs.version != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ steps.version.outputs.version }}
        LATEST: ${{ steps.latest.outputs.version }}
      run: |
        # A log warning is easy to miss, so the check is also handed to code scanning: a SARIF
        # file with one alert while a newer release is out, and with none once the version is
        # current, which closes the alert. The alert sits on .open-java-format-version, the file
        # to change. The upload goes straight to the REST API: github/codeql-action/upload-sarif
        # fails the job when the permission is missing, and this must stay best-effort, like the
        # check itself — nothing here may fail the build.
        case "$GITHUB_REF" in
          refs/heads/*|refs/tags/*|refs/pull/*) ;;
          *) echo "Code scanning takes no results for ref '$GITHUB_REF' — not reporting the version check."; exit 0 ;;
        esac

        # owner/repo/.github/workflows/ci.yml@refs/heads/main -> .github/workflows/ci.yml
        WORKFLOW="${GITHUB_WORKFLOW_REF#"$GITHUB_REPOSITORY/"}"
        WORKFLOW="${WORKFLOW%@*}"

        RESULTS='[]'
        if [ "$LATEST" != "$VERSION" ]; then
          FILE=".open-java-format-version"
          LINE=1
          # Code scanning tells alerts apart by this fingerprint, made from the line's text.
          TEXT=$(head -n1 "$FILE" | tr -d '\r')
          FINGERPRINT=$(printf '%s' "${TEXT//[[:space:]]/}" | git hash-object --stdin)
          RESULTS=$(jq -n \
            --arg text "open-java-format $LATEST is available; $FILE has $VERSION." \
            --arg file "$FILE" --argjson line "$LINE" --argjson end "$(( ${#TEXT} + 1 ))" \
            --arg fingerprint "${FINGERPRINT:0:16}:1" \
            '[{
              ruleId: "outdated-version",
              level: "warning",
              message: {text: $text},
              locations: [{physicalLocation: {
                artifactLocation: {uri: $file},
                region: {startLine: $line, startColumn: 1, endLine: $line, endColumn: $end}
              }}],
              partialFingerprints: {primaryLocationLineHash: $fingerprint}
            }]')
        fi

        HELP="$RUNNER_TEMP/open-java-format-version-help.md"
        cat > "$HELP" <<'HELP_END'
        A newer [open-java-format release](https://github.com/openjavaformat/open-java-format/releases) is out than the one named in `.open-java-format-version`. Releases fix formatting bugs, so code that passes with the pinned version may be formatted differently by the newer one.

        To update, put the new release in `.open-java-format-version` at the repository root. The action and the pre-commit hook both read that file. The alert closes on its own once the workflow runs with the latest release.
        HELP_END

        # One category per workflow and job, so that uploads from different jobs do not replace
        # one another: open-java-format-action/ci.yml/format/
        CATEGORY="open-java-format-action/${WORKFLOW:+${WORKFLOW##*/}/}${GITHUB_JOB:-job}/"
        SARIF=$(jq -n --rawfile help "$HELP" --arg category "$CATEGORY" --argjson results "$RESULTS" '{
          "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
          version: "2.1.0",
          runs: [{
            tool: {driver: {
              name: "open-java-format-action",
              informationUri: "https://github.com/openjavaformat/open-java-format-action",
              rules: [{
                id: "outdated-version",
                name: "OutdatedVersion",
                shortDescription: {text: "A newer open-java-format release is available"},
                fullDescription: {text: ".open-java-format-version names an open-java-format version older than the latest release. Releases fix formatting bugs, so code that passes with the pinned version may be formatted differently by the newer one."},
                help: {text: $help, markdown: $help},
                defaultConfiguration: {level: "warning"},
                properties: {tags: ["maintainability"], precision: "very-high", "problem.severity": "warning"}
              }]
            }},
            automationDetails: {id: $category},
            results: $results
          }]
        }')

        RESPONSE="$RUNNER_TEMP/open-java-format-code-scanning-response.json"
        STATUS=$(jq -n --arg sha "$GITHUB_SHA" --arg ref "$GITHUB_REF" \
            --arg started "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sarif "$(printf '%s' "$SARIF" | gzip -c | base64 | tr -d '\n')" \
            '{commit_sha: $sha, ref: $ref, started_at: $started, tool_name: "open-java-format-action", sarif: $sarif}' \
          | curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" --data-binary @- \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$GITHUB_REPOSITORY/code-scanning/sarifs" \
          || true)
        STATUS="${STATUS:-000}"
        case "$STATUS" in
          202)
            if [ "$RESULTS" = "[]" ]; then
              echo "Reported to code scanning: open-java-format $VERSION is the latest release."
            else
              echo "Reported to code scanning: an alert on $FILE:$LINE, open-java-format $LATEST is available."
            fi
            ;;
          403|404)
            # No permission, no GitHub Code Security on a private repository, or the read-only
            # token of a pull request from a fork. The log warning above stays.
            echo "Code scanning did not accept the version check (HTTP $STATUS: $(jq -r '.message // empty' "$RESPONSE" 2>/dev/null)). To get it as a code scanning alert, give the job the 'security-events: write' permission; a private repository also needs GitHub Code Security. Set the code-scanning input to 'false' to stop these uploads."
            ;;
          *)
            echo "::warning::Could not report the version check to code scanning (HTTP $STATUS): $(cat "$RESPONSE" 2>/dev/null)"
            ;;
        esac

    - name: Cache open-java-format binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ github.action_path }}/${{ steps.platform.outputs.binary }}
        key: open-java-format-${{ steps.version.outputs.version }}-${{ steps.platform.outputs.suffix }}

    - name: Download open-java-format native binary
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        SUFFIX="${{ steps.platform.outputs.suffix }}"
        BASE_URL="https://repo1.maven.org/maven2/dev/openjavaformat/open-java-format-native/${VERSION}"
        ARTIFACT="open-java-format-native-${VERSION}-nativeImage-${SUFFIX}.${{ steps.platform.outputs.extension }}"
        DOWNLOAD_URL="${BASE_URL}/${ARTIFACT}"
        BINARY="${{ github.action_path }}/${{ steps.platform.outputs.binary }}"

        echo "Downloading open-java-format ${VERSION} (${SUFFIX})..."
        if ! curl -sSfL -o "$BINARY" "$DOWNLOAD_URL"; then
          rm -f "$BINARY"
          echo "::error::Failed to download open-java-format from: $DOWNLOAD_URL"
          exit 1
        fi

        chmod +x "$BINARY"

    - name: Set binary path
      shell: bash
      run: echo "OJF_BINARY=${{ github.action_path }}/${{ steps.platform.outputs.binary }}" >> "$GITHUB_ENV"

    - name: Collect files to check
      shell: bash
      run: |
        MODE="${{ inputs.mode }}"

        if [ "$MODE" = "all" ]; then
          echo "Mode: all — checking every .java file"
          FILES=$(find . -name '*.java' -not -path './.git/*' | sed 's|^\./||' | tr '\n' ' ')
        elif [ -n "${{ github.event.pull_request.number }}" ]; then
          echo "Mode: changed (PR #${{ github.event.pull_request.number }})"
          FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | { grep '\.java$' || true; } | tr '\n' ' ')
        elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
          echo "Mode: changed (push ${{ github.event.before }}...${{ github.sha }})"
          FILES=$(git diff --name-only --diff-filter=ACMR ${{ github.event.before }}...${{ github.sha }} -- '*.java' | tr '\n' ' ')
        else
          echo "Mode: changed — unknown event, falling back to all .java files"
          FILES=$(find . -name '*.java' -not -path './.git/*' | sed 's|^\./||' | tr '\n' ' ')
        fi

        # Drop files matching patterns in .open-java-format-exclude (repo root), if present.
        # Each non-empty, non-comment line is a git pathspec (relative to the repo root).
        # This file is the single source of exclusions, shared with the pre-commit hook.
        EXCLUDE_FILE=".open-java-format-exclude"
        if [ -n "$FILES" ] && [ -f "$EXCLUDE_FILE" ]; then
          PATTERNS=()
          while IFS= read -r line || [ -n "$line" ]; do
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            case "$line" in ''|\#*) continue ;; esac
            PATTERNS+=("$line")
          done < "$EXCLUDE_FILE"

          if [ ${#PATTERNS[@]} -gt 0 ]; then
            EXCLUDED=$(git ls-files --cached --others --exclude-standard -- "${PATTERNS[@]}" 2>/dev/null || true)
            if [ -n "$EXCLUDED" ]; then
              echo "Excluding files matching $EXCLUDE_FILE:"
              printf '%s\n' "$EXCLUDED" | sed 's/^/  /'
              FILES=$(printf '%s\n' $FILES | grep -vxFf <(printf '%s\n' "$EXCLUDED") | tr '\n' ' ' || true)
            fi
          fi
        fi

        if [ -z "$FILES" ]; then
          echo "No Java files to check."
          echo "OJF_FILES=" >> "$GITHUB_ENV"
        else
          echo "Files to check:"
          echo "$FILES" | tr ' ' '\n' | grep -v '^$'
          echo "OJF_FILES=$FILES" >> "$GITHUB_ENV"
        fi
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Run format check
      shell: bash
      run: |
        if [ -z "$OJF_FILES" ]; then
          echo "Nothing to check, skipping."
          exit 0
        fi

        UNFORMATTED=()
        for FILE in $OJF_FILES; do
          if [ -f "$FILE" ]; then
            if ! "$OJF_BINARY" --dry-run --set-exit-if-changed "$FILE" > /dev/null 2>&1; then
              UNFORMATTED+=("$FILE")
            fi
          fi
        done

        if [ ${#UNFORMATTED[@]} -gt 0 ]; then
          echo "::error::Java formatting issues found!"
          echo ""
          echo "The following files are not formatted correctly:"
          for FILE in "${UNFORMATTED[@]}"; do
            echo "  $FILE"
          done
          echo ""
          echo "Run open-java-format locally to fix:"
          echo "  open-java-format --replace ${UNFORMATTED[*]}"
          exit 1
        fi

        echo "All files are correctly formatted."
